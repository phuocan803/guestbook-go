apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-replica
  labels:
    app: redis
    role: replica
spec:
  replicas: 2
  selector:
    matchLabels:
      app: redis
      role: replica
  template:
    metadata:
      labels:
        app: redis
        role: replica
    spec:
      containers:
      - name: redis-replica
        image: redis:6.2-alpine
        command: ["redis-server", "--replicaof", "redis-master", "6379"]
        ports:
        - name: redis-server
          containerPort: 6379
